<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Application received</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks{min-height:100vh;display:grid;place-items:center;padding:30px}.thanks-card{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:32px;padding:44px}.thanks-card h1{font-size:clamp(2.6rem,6vw,5rem);line-height:.98;letter-spacing:-.055em;margin:18px 0}.thanks-card p{color:var(--muted);line-height:1.65;font-size:1.02rem}.thanks-card .button{margin-top:18px}
  </style>
</head>
<body>
  <main class="thanks">
    <section class="thanks-card">
      <span class="eyebrow">Application received</span>
      <h1>Your project is now in review.</h1>
      <p>Your situation, budget, background and goal will be reviewed first. If there is a useful path to discuss, you will be contacted directly using the details you submitted.</p>
      <a class="button primary" href="/">Back to home</a>
    </section>
  </main>
</body>
</html>
