<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تم استلام طلب الاستشارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{font-family:Tajawal,Inter,system-ui,sans-serif}.thanks{min-height:100vh;display:grid;place-items:center;padding:30px}.thanks-card{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:32px;padding:44px}.thanks-card h1{font-size:clamp(2.6rem,6vw,5rem);line-height:1.05;letter-spacing:-.04em;margin:18px 0}.thanks-card p{color:var(--muted);line-height:1.8;font-size:1.02rem}.thanks-card .button{margin-top:18px}
  </style>
</head>
<body>
  <main class="thanks">
    <section class="thanks-card">
      <span class="eyebrow">تم استلام الطلب</span>
      <h1>طلب الاستشارة المجانية وصل.</h1>
      <p>سنراجع تفاصيل مشروعك والمعلومات التي أرسلتها لتحديد الخطوة المناسبة، ثم نستخدم رقم التواصل الذي أدخلته للمتابعة معك مباشرة.</p>
      <a class="button primary" href="/">العودة للرئيسية</a>
    </section>
  </main>
</body>
</html>
